<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="kaviri">
  <title>kaviri</title>
  <!-- A tile, not a transparent mark: at 16px against browser chrome the tile is
       what makes the two squares legible. The tile inverts in dark mode so the
       edge never disappears into the toolbar. -->
  <style>
    :root { --tile: #0f0f10; --frame: #f7f7f5; --second: #ff6b3d; }
    @media (prefers-color-scheme: dark) {
      :root { --tile: #f7f7f5; --frame: #0f0f10; --second: #c7361a; }
    }
  </style>
  <rect width="32" height="32" rx="6" fill="var(--tile)"/>
  <rect x="5.5" y="5.5" width="12.5" height="12.5" rx="1.5" fill="var(--frame)"/>
  <rect x="13" y="13" width="12.5" height="12.5" rx="1.5" fill="none" stroke="var(--second)" stroke-width="2.5"/>
</svg>
