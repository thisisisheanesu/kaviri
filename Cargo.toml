[package]
name = "lensa"
version = "0.1.0"
edition = "2021"
description = "Programmable recording browser: agents drive it, it emits Screen Studio-style auto-zoomed videos"
license = "MIT"

[dependencies]
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 2
